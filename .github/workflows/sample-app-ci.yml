name: sample-app CI

on:
  push:
    branches: [main]
    paths:
      - "examples/sample-app/**"
      - ".github/workflows/sample-app-ci.yml"
  pull_request:
    paths:
      - "examples/sample-app/**"
      - ".github/workflows/sample-app-ci.yml"

permissions:
  contents: read

concurrency:
  group: sample-app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: examples/sample-app

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/sample-app/go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  image-build:
    name: Build image
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: examples/sample-app
          push: false
          load: false
          build-args: VERSION=${{ github.sha }}
          tags: sample-app:ci
