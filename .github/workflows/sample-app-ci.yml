name: sample-app CI

on:
  push:
    branches: [main]
    paths:
      - "examples/sample-app/**"
      - ".github/workflows/sample-app-ci.yml"
  pull_request:
    paths:
      - "examples/sample-app/**"
      - ".github/workflows/sample-app-ci.yml"

permissions:
  contents: read

concurrency:
  group: sample-app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: examples/sample-app

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/sample-app/go.mod
          cache: true
          cache-dependency-path: examples/sample-app/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Go dependency vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  image-build:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: examples/sample-app
          push: false
          load: false
          build-args: VERSION=${{ github.sha }}
          tags: sample-app:ci
